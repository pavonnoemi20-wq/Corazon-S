<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón con Chachachá</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: pointer; /* Cambia el cursor para indicar que puedes hacer clic */
        }
        #instruccion {
            position: fixed;
            top: 20px;
            color: rgba(255, 0, 0, 0.5);
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="instruccion">Haz clic para activar la música 🎵</div>
<canvas id="heartCanvas"></canvas>

<audio id="miMusica" src="chachacha.mp3.mpeg" loop></audio>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('miMusica');
    const instruccion = document.getElementById('instruccion');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const particleCount = 100; 
    const text = "I love you"; // <--- Aquí puedes cambiarlo por un nombre

    // Activar música al hacer clic
    window.addEventListener('click', () => {
        audio.play();
        instruccion.style.display = 'none'; // Oculta el texto al sonar
    }, { once: true });

    function getHeartPoint(t) {
        return {
            x: 16 * Math.pow(Math.sin(t), 3),
            y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
    }

    class Particle {
        constructor(t) {
            this.t = t;
            this.baseSize = 14;
            this.size = this.baseSize;
        }
        update() {
            this.size = this.baseSize + Math.sin(Date.now() * 0.005) * 2;
        }
        draw() {
            const pos = getHeartPoint(this.t);
            const x = pos.x * 15 + canvas.width / 2;
            const y = pos.y * 15 + canvas.height / 2;
            ctx.fillStyle = "#FF0000";
            ctx.font = `bold ${this.size}px Arial`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = "red";
            ctx.fillText(text, x, y);
        }
    }

    function init() {
        for (let i = 0; i < particleCount; i++) {
            const t = (i / particleCount) * Math.PI * 2;
            particles.push(new Particle(t));
        }
    }

    function animate() {
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    init();
    animate();
</script>

</body>
</html>
