<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón para Ti</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none; /* Evita zoom accidental en móviles */
        }
        #instruccion {
            position: fixed;
            top: 15%;
            color: rgba(255, 0, 0, 0.7);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            text-align: center;
            width: 100%;
            z-index: 10;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="instruccion">Toca la pantalla para la magia 🎵</div>
<canvas id="heartCanvas"></canvas>

<audio id="miMusica" src="chachacha.mp3.mpeg" preload="auto" loop></audio>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('miMusica');
    const instruccion = document.getElementById('instruccion');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    const particleCount = 85; 
    const text = "I love you"; // <--- Puedes cambiarlo aquí si quieres

    // Función de reproducción inmediata
    function iniciarTodo() {
        audio.play().catch(e => console.log("Esperando interacción..."));
        instruccion.style.opacity = '0';
        setTimeout(() => instruccion.style.display = 'none', 500);
    }

    // Eventos para PC y Móvil
    window.addEventListener('click', iniciarTodo, { once: true });
    window.addEventListener('touchstart', iniciarTodo, { once: true });

    function getHeartPoint(t) {
        return {
            x: 16 * Math.pow(Math.sin(t), 3),
            y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
    }

    class Particle {
        constructor(t) {
            this.t = t;
            this.baseSize = 13;
        }
        update() {
            this.size = this.baseSize + Math.sin(Date.now() * 0.005) * 2;
        }
        draw() {
            const pos = getHeartPoint(this.t);
            
            // ESCALA RESPONSIVA: Ajusta el tamaño del corazón según el ancho o alto
            const scale = Math.min(canvas.width / 45, canvas.height / 45);
            
            const x = pos.x * scale + canvas.width / 2;
            const y = pos.y * scale + canvas.height / 2;

            ctx.fillStyle = "#FF0000";
            ctx.font = `bold ${this.size}px Arial`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = "red";
            ctx.textAlign = "center";
            ctx.fillText(text, x, y);
        }
    }

    function init() {
        for (let i = 0; i < particleCount; i++) {
            const t = (i / particleCount) * Math.PI * 2;
            particles.push(new Particle(t));
        }
    }

    function animate() {
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }

    init();
    animate();
</script>

</body>
</html>
